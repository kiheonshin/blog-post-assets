<svg class="klu-instrument-map" viewBox="0 0 1040 560" role="img" aria-labelledby="klu-map-title klu-map-desc" xmlns="http://www.w3.org/2000/svg"><title id="klu-map-title">KIHEON LIFE UNIVERSE 공개 표면 맵</title><desc id="klu-map-desc">격리 보존, 시간과 공간의 관계, 브랜드 시스템, 공개 제품, 에이전트와 도구, 검증과 발행이 검증의 막을 사이에 두고 배치된 전체 구조.</desc><style>.km-frame{fill:#fbfbf8;stroke:#17181a}.km-grid{stroke:#cfcfc8;stroke-width:1;opacity:.28}.km-rail{stroke:#8b8d92;stroke-width:1;opacity:.68}.km-membrane{fill:#f3f3ef;stroke:#2457d6;stroke-width:1;stroke-dasharray:7 8}.km-point{fill:#fbfbf8;stroke:#2457d6;stroke-width:1.5}.km-product-dot{fill:#2457d6}.km-label,.km-kicker,.km-metric,.km-product-label{font-family:"SFMono-Regular","Roboto Mono",monospace;fill:#17181a;letter-spacing:.09em}.km-label{font-size:12px;font-weight:700}.km-detail,.km-product-detail,.km-membrane-copy{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;fill:#5e6065}.km-detail{font-size:13px}.km-kicker{font-size:10px;fill:#2457d6}.km-metric{font-size:10px;fill:#686a6f}.km-membrane-title{font-family:"SFMono-Regular","Roboto Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.12em;fill:#2457d6}.km-membrane-copy{font-size:13px}.km-product-label{font-size:10px;font-weight:700}.km-product-detail{font-size:10px}</style><defs><pattern id="klu-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path class="km-grid" d="M 28 0 L 0 0 0 28" fill="none"/></pattern></defs><rect class="km-frame" x="28" y="28" width="984" height="504" rx="6"/><rect x="29" y="29" width="982" height="502" rx="5" fill="url(#klu-grid)"/><g data-node-id="klu"><text class="km-kicker" x="54" y="58">KLU PUBLIC SURFACE MAP · SUMMARY</text><text class="km-metric" x="986" y="58" text-anchor="end">6 SYSTEMS · 6 SURFACES · PRIVATE BODY 0</text></g><line class="km-rail" x1="136" y1="114" x2="136" y2="180"/><line class="km-rail" x1="438" y1="114" x2="438" y2="180"/><line class="km-rail" x1="740" y1="114" x2="740" y2="180"/><g data-node-id="vault"><circle class="km-point" cx="136" cy="104" r="6"/><text class="km-label" x="152" y="108" text-anchor="start">LOCAL VAULT</text><text class="km-detail" x="152" y="129" text-anchor="start">격리 보존 · 원본</text></g><g data-node-id="relations"><circle class="km-point" cx="438" cy="104" r="6"/><text class="km-label" x="454" y="108" text-anchor="start">TIME · SPACE · RELATION</text><text class="km-detail" x="454" y="129" text-anchor="start">시간 · 공간 · 관계</text></g><g data-node-id="brand"><circle class="km-point" cx="740" cy="104" r="6"/><text class="km-label" x="756" y="108" text-anchor="start">BRAND · DESIGN</text><text class="km-detail" x="756" y="129" text-anchor="start">브랜드 정체성 · 자산</text></g><rect class="km-membrane" x="72" y="180" width="896" height="80" rx="5"/><text class="km-membrane-title" x="92" y="208">검증의 막 · VERIFICATION MEMBRANE</text><text class="km-membrane-copy" x="92" y="236">출처 · 등급 · 공개 경계 · 품질 게이트를 통과한 상태만 아래 공개 표면으로 이동합니다.</text><text class="km-metric" x="944" y="208" text-anchor="end">SOURCE · GRADE · GATE · QA</text><line class="km-rail" x1="136" y1="260" x2="136" y2="414"/><line class="km-rail" x1="520" y1="260" x2="520" y2="300"/><line class="km-rail" x1="900" y1="260" x2="900" y2="414"/><g data-node-id="actors"><circle class="km-point" cx="136" cy="424" r="6"/><text class="km-label" x="152" y="428" text-anchor="start">AGENTS · TOOLS</text><text class="km-detail" x="152" y="449" text-anchor="start">Agents · Skills · Voice</text></g><g data-node-id="operations"><circle class="km-point" cx="900" cy="424" r="6"/><text class="km-label" x="884" y="428" text-anchor="end">QA · RELEASE</text><text class="km-detail" x="884" y="449" text-anchor="end">Harness · QA · Gate</text></g><g data-node-id="products"><rect x="302" y="300" width="436" height="172" rx="5" fill="#fbfbf8" stroke="#cfcfc8"/><text class="km-label" x="324" y="328">PUBLIC SURFACES</text><text class="km-detail" x="324" y="349">공개 제품 · 여섯 표면</text><g data-node-id="blog"><circle class="km-product-dot" cx="330" cy="376" r="4"/><text class="km-product-label" x="342" y="380">BLOG</text><text class="km-product-detail" x="342" y="396">편집·서사</text></g><g data-node-id="archive"><circle class="km-product-dot" cx="470" cy="376" r="4"/><text class="km-product-label" x="482" y="380">PUBLIC ARCHIVE</text><text class="km-product-detail" x="482" y="396">공개 근거·자료</text></g><g data-node-id="universe"><circle class="km-product-dot" cx="610" cy="376" r="4"/><text class="km-product-label" x="622" y="380">UNIVERSE</text><text class="km-product-detail" x="622" y="396">관측·현황</text></g><g data-node-id="slides"><circle class="km-product-dot" cx="330" cy="416" r="4"/><text class="km-product-label" x="342" y="420">SLIDES</text><text class="km-product-detail" x="342" y="436">발표·시간 압축</text></g><g data-node-id="outside"><circle class="km-product-dot" cx="470" cy="416" r="4"/><text class="km-product-label" x="482" y="420">OUTSIDE</text><text class="km-product-detail" x="482" y="436">기록을 펼쳐 읽는 면</text></g><g data-node-id="inside"><circle class="km-product-dot" cx="610" cy="416" r="4"/><text class="km-product-label" x="622" y="420">INSIDE</text><text class="km-product-detail" x="622" y="436">기록 안으로 들어가는 면</text></g></g><text class="km-metric" x="54" y="512">LOCAL VAULT != PUBLIC ARCHIVE</text><text class="km-metric" x="986" y="512" text-anchor="end">NO PRIVATE BODY · NO REAL RELATION</text></svg>
